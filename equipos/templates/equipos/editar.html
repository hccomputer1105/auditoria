<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Equipo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light p-5">
    <div class="container" style="max-width: 800px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="text-secondary"><i class="bi bi-pencil-square"></i> Editar Equipo</h3>
            <a href="/inventario/" class="btn btn-outline-secondary">Volver al Inventario</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Clasificación de Hardware</label>
                            <select class="form-select bg-light" name="tipo_equipo">
                                <option value="Computadora" {% if equipo.tipo_equipo == 'Computadora' %}selected{% endif %}>Computadora</option>
                                <option value="Monitor" {% if equipo.tipo_equipo == 'Monitor' %}selected{% endif %}>Monitor</option>
                                <option value="Teclado" {% if equipo.tipo_equipo == 'Teclado' %}selected{% endif %}>Teclado</option>
                                <option value="Mouse" {% if equipo.tipo_equipo == 'Mouse' %}selected{% endif %}>Mouse</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Estatus Físico</label>
                            <select class="form-select bg-light" name="estatus">
                                <option value="Bueno" {% if equipo.estatus == 'Bueno' %}selected{% endif %}>Óptimo / Bueno</option>
                                <option value="En reparación" {% if equipo.estatus == 'En reparación' %}selected{% endif %}>En reparación</option>
                                <option value="Malo" {% if equipo.estatus == 'Malo' %}selected{% endif %}>Dañado</option>
                            </select>
                        </div>
                    </div>

                    <h5 class="fw-bold mt-4 mb-3 text-primary">Software Instalado</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="form-check form-switch fs-5 mb-2">
                                <input class="form-check-input" type="checkbox" name="tiene_antivirus" {% if equipo.tiene_antivirus %}checked{% endif %}>
                                <label class="form-check-label">Antivirus Activo</label>
                            </div>
                            <div class="form-check form-switch fs-5 mb-2">
                                <input class="form-check-input" type="checkbox" name="prog_anydesk" {% if equipo.prog_anydesk %}checked{% endif %}>
                                <label class="form-check-label">AnyDesk</label>
                            </div>
                            <div class="form-check form-switch fs-5 mb-2">
                                <input class="form-check-input" type="checkbox" name="prog_winrar" {% if equipo.prog_winrar %}checked{% endif %}>
                                <label class="form-check-label">WinRAR / ZIP</label>
                            </div>
                            <div class="form-check form-switch fs-5 mb-2">
                                <input class="form-check-input" type="checkbox" name="prog_pdf" {% if equipo.prog_pdf %}checked{% endif %}>
                                <label class="form-check-label">Lector PDF</label>
                            </div>
                        </div>
                        <div class="col-md-6 bg-light p-3 rounded">
                            <div class="form-check form-switch fs-5 mb-2">
                                <input class="form-check-input" type="checkbox" name="prog_office" {% if equipo.prog_office %}checked{% endif %}>
                                <label class="form-check-label fw-bold">Microsoft Office</label>
                            </div>
                            <input type="text" class="form-control" name="version_office" value="{{ equipo.version_office }}" placeholder="Versión">
                        </div>
                    </div>
<hr>
                    <h5 class="fw-bold mt-4 mb-3 text-success"><i class="bi bi-key"></i> Gestión de Licencias</h5>
                    <div class="row mb-4">
                        <div class="col-md-4">
                            <div class="form-check form-switch fs-5 mb-2">
                                <input class="form-check-input" type="checkbox" id="chkLicOffice" name="licencia_office" {% if equipo.licencia_office %}checked{% endif %}>
                                <label class="form-check-label" for="chkLicOffice">Licencia de Office</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check form-switch fs-5 mb-2">
                                <input class="form-check-input" type="checkbox" id="chkLicWindows" name="licencia_windows" onchange="toggleWindows()" {% if equipo.licencia_windows %}checked{% endif %}>
                                <label class="form-check-label" for="chkLicWindows">Licencia de Windows</label>
                            </div>
                            <div id="divWindows" style="display: {% if equipo.licencia_windows %}block{% else %}none{% endif %};" class="mt-2 p-2 bg-light border rounded">
                                <input type="text" class="form-control" name="version_windows" value="{{ equipo.version_windows|default:'' }}" placeholder="Versión">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check form-switch fs-5 mb-2">
                                <input class="form-check-input" type="checkbox" id="chkLicErp" name="licencia_erp" onchange="toggleErp()" {% if equipo.licencia_erp %}checked{% endif %}>
                                <label class="form-check-label" for="chkLicErp">Sistema Administrativo</label>
                            </div>
                            <div id="divErp" style="display: {% if equipo.licencia_erp %}block{% else %}none{% endif %};" class="mt-2 p-2 bg-light border rounded">
                                <select class="form-select" name="tipo_erp">
                                    <option value="" {% if not equipo.tipo_erp %}selected{% endif %}>Seleccione...</option>
                                    <option value="SAP" {% if equipo.tipo_erp == 'SAP' %}selected{% endif %}>SAP</option>
                                    <option value="Galac" {% if equipo.tipo_erp == 'Galac' %}selected{% endif %}>Galac</option>
                                    <option value="Profit" {% if equipo.tipo_erp == 'Profit' %}selected{% endif %}>Profit Plus</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <script>
                        function toggleWindows() { document.getElementById('divWindows').style.display = document.getElementById('chkLicWindows').checked ? 'block' : 'none'; }
                        function toggleErp() { document.getElementById('divErp').style.display = document.getElementById('chkLicErp').checked ? 'block' : 'none'; }
                    </script>
                    <div class="mt-4 text-end">
                        <button type="submit" class="btn btn-success px-4"><i class="bi bi-save"></i> Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
